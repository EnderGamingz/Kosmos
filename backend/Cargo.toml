[package]
name = "kosmos"
version = "0.1.0"
edition = "2021"
authors = ["Philipp Hergenhahn <philipp.hergenhahn@setilic.com>"]
repository = "https://git.flouet.com/philipp.hergenhahn/kosmos"

[dependencies]
# Async
tokio = { version = "1.44.1", features = ["full"] }
tokio-util = { version = "0.7.14", features = ["io"] }
futures = "0.3.31"

# HTTP
axum = { version = "0.7.5", features = ["json", "multipart", "ws"] }

# Image
# photon-rs = { version = "0.3.2" }
image = "0.25.5"
kamadak-exif = "0.6.1"

# Serialization
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.140" }
serde_trim = "1.1.0"

# Database
sqlx = { version = "0.8.3", features = ["runtime-tokio", "postgres", "chrono", "bigdecimal", "uuid", "tls-native-tls"] }
sonyflake = "0.3.0"
bigdecimal = "0.4.7"

# Tracing
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
tracing = "0.1.41"
log = "0.4.22"

# Session
tower-sessions = "0.13.0"
tower-http = { version = "0.6.2", features = ["cors", "trace", "fs"] }

# Auth
bcrypt = "0.17.0"
webauthn-rs = { version = "0.5.1", features = ["danger-allow-state-serialisation", "conditional-ui"] }

# Utils
lazy_static = "1.4.0"
itertools = "0.14.0"
chrono = { version = "0.4.40", features = ["serde"] }

# Validation
axum-valid = "0.20.0"
validator = { version = "0.18.1", features = ["derive"] }
regex = "1.10.6"

# Config
dotenvy = "0.15.7"

# Misc
zip = "2.3.0"
ts-rs = { version = "10.1.0", features = ["chrono-impl", "serde-json-impl"] }